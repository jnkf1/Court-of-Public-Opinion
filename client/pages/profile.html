<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Profile</title>
	</head>
	<body>
		<header></header>

		<main class="">
			<section id="signUp">
				<h1>Sign Up</h1>
				<form id="signUpForm">
					<input type="text" id="signUpUsername" placeholder="Username" required />
					<input type="email" id="signUpEmail" placeholder="Email" required />
					<input
						type="password"
						id="signUpPassword"
						placeholder="Password"
						required
					/>
					<button type="submit">Sign Up</button>
				</form>
			</section>
			<section id="logIn">
				<form id="logInForm">
					<input type="logInEmail" id="email" placeholder="Email" required />
					<input
						type="password"
						id="logInPassword"
						placeholder="Password"
						required
					/>
					<button id="logInBtn" type="submit">Log In</button>
				</form>
			</section>
			<section id="Profile">
				<p>Username: <span id="profileUsername"></span></p>
				<p>Email: <span id="profileEmail"></span></p>
				<button id="logOutBtn" type="button">Log Out</button>
			</section>
		</main>
		<footer>
			<p class="copyright">
				© Court Of Public Opinion 2026. All rights reserved.
			</p>
		</footer>
		<div id="notification" class="notification hidden"></div>
		<script src="/client/scripts/env.js"></script>
		<script src="/client/scripts/axios.min.js"></script>
		<script src="/client/scripts/profie.js"></script>
	</body>
</html>
