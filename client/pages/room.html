<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Live Debate</title>
		<link rel="stylesheet" href="/client/styles/room.css" />
	</head>
	<body>
		<header>
			<div class="masthead">
				<div class="masthead-top">
					<span>EST. 2026</span>
					<span>THE DIGITAL DEBATE JOURNAL</span>
					<span>VOL. 01</span>
				</div>

				<a href="/client/index.html" class="brand"> COURT OF PUBLIC OPINION </a>

				<div class="masthead-tagline">WHERE ARGUMENTS ARE PUT ON TRIAL</div>
			</div>

			<nav>
				<a href="/client/index.html">HOME</a>

				<a href="/client/pages/debate.html"> DEBATE </a>

				<a href="/client/pages/courtroom.html" class="active"> COURTROOM </a>

				<a href="/client/pages/cases.html"> COURT RECORDS </a>

				<a href="/client/pages/profile.html"> MY RECORD </a>
			</nav>
		</header>

		<main class="room-main">
			<section id="roomScreen">
				<p class="section-label">LIVE CASE</p>
				<h2 id="roomTopicLabel"></h2>

				<div class="room-stances">
					<p id="roomStanceLabel"></p>
					<p id="roomOpponentLabel"></p>
				</div>

				<p id="roomTimer"></p>
			</section>

			<section id="chatSection">
				<div id="chatLog"></div>

				<form id="messageForm">
					<input
						type="text"
						id="messageInput"
						placeholder="Type your argument..."
						autocomplete="off"
					/>
					<button type="submit" id="sendMessageBtn">SEND</button>
				</form>
			</section>
		</main>

		<footer>
			<div class="footer-line"></div>

			<div class="footer-links">
				<a href="/client/pages/policies/privacy_policy.html">PRIVACY POLICY</a>
				<a href="/client/pages/policies/ai_policy.html">AI POLICY</a>
				<a href="/client/pages/contact.html">CONTACT US</a>
			</div>

			<p>© COURT OF PUBLIC OPINION 2026 · ALL RIGHTS RESERVED</p>
		</footer>

		<div id="notification" class="notification hidden"></div>

		<script src="/client/scripts/env.js"></script>
		<script src="/client/scripts/axios.min.js"></script>
		<script src="/client/scripts/helper.js"></script>
		<script src="/client/scripts/room.js"></script>
	</body>
</html>
